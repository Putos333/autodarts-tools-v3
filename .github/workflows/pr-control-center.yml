name: pr-control-center

# Gate für Pull Requests gegen main und feature/control-center sowie für
# Pushes auf main.
#
# Führt die bereits lokal verifizierten Checks aus (keine neuen Dependencies,
# kein Testframework-Wechsel); jeder Check läuft genau einmal, siehe Kommentar
# vor den Schritten. Die CI führt immer das volle Profil in der CI-Umgebung aus
# und vertraut keinem lokalen Gatekeeper-Cache (scripts/gate.mjs ist ein
# lokales Werkzeug). Bewusst additiv und vollständig isoliert von
# build-firefox.yml — kein gemeinsamer Trigger, kein gemeinsamer Job, keine
# gemeinsame Datei. Root Cause für 0 CI-Checks auf PR #16 war ein reiner
# Trigger-Branch-Filter-Mismatch: build-firefox.yml (pull_request nur gegen
# develop) reagierte nicht auf PRs gegen feature/control-center.
#
# Kein Gate hier nutzt continue-on-error — jeder Fehler lässt den Workflow
# tatsächlich fehlschlagen.

on:
  pull_request:
    branches:
      - 'main'
      - 'feature/control-center'
  push:
    branches:
      - 'main'

concurrency:
  group: pr-control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Control Center PR Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # `yarn test` enthält bereits die Lifecycle-Contract-Tests (tests/*.test.mjs)
      # und die Gatekeeper-Tests (tests/gate.test.mjs): kein separater Lauf.
      # `yarn build` / `yarn build:firefox` würden über `preflight` compile + test
      # erneut ausführen; die Build-Schritte rufen deshalb wxt direkt auf
      # (derselbe Befehl wie in package.json), nachdem compile/test oben liefen.
      - name: Unit, Lifecycle and Gatekeeper Tests
        run: yarn test

      - name: Component Tests
        run: yarn test:components

      - name: TypeScript
        run: yarn compile

      - name: Firefox MV2 Build
        run: yarn wxt build -b firefox

      - name: Chrome MV3 Build
        run: yarn wxt build
