name: pr-control-center

# Pull-Request-Gate für PRs gegen main und feature/control-center. Direkte
# Pushes auf main lösen diesen Workflow nicht aus (nur pull_request).
#
# Führt die fünf bereits lokal verifizierten Checks über die bestehenden
# package.json-Scripts aus (keine neuen Scripts, keine neuen Dependencies,
# kein Testframework-Wechsel). Bewusst additiv und vollständig isoliert von
# build-firefox.yml — kein gemeinsamer Trigger, kein gemeinsamer Job, keine
# gemeinsame Datei. Root Cause für 0 CI-Checks auf PR #16 war ein reiner
# Trigger-Branch-Filter-Mismatch: build-firefox.yml (pull_request nur gegen
# develop) reagierte nicht auf PRs gegen feature/control-center.
#
# Kein Gate hier nutzt continue-on-error — jeder Fehler lässt den Workflow
# tatsächlich fehlschlagen.

on:
  pull_request:
    branches:
      - 'main'
      - 'feature/control-center'

concurrency:
  group: pr-control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Control Center PR Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Unit Tests
        run: yarn test

      - name: Lifecycle Contract Tests
        run: yarn test:lifecycle

      - name: TypeScript
        run: yarn compile

      - name: Firefox MV2 Build
        run: yarn build:firefox

      - name: Chrome MV3 Build
        run: yarn build
